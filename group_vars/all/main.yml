---
# Host-weite Variablen. Tragen keine Secrets - die stehen in
# group_vars/all/vault.yml (gitignored, per ansible-vault verschluesselt).

# Der einzige Account mit SSH-Zugang und docker-Gruppe.
admin_user: admin

# sshd-Port; die ufw-Regel erlaubt ihn nur auf tailscale0.
ssh_port: 2222

# Basis-Domain der oeffentlichen Dienste (chat., n8n., search. ...).
# Seit 13.11.2026 die echte Domain des Hosts, nicht mehr der Platzhalter
# example.com: sonst muesste jeder Lauf base_domain per -e ueberschreiben, und
# ein vergessenes -e haette die Container-URLs auf example.com gedreht.
base_domain: kisium.de

# Zeitzone des Hosts: Logs, Cron und Zertifikate laufen in derselben Zeit.
timezone: Europe/Berlin

# Oeffentliche Ports. Nur was von aussen erreichbar sein muss.
# 80/443: Nginx Proxy Manager, 8443: TLS-Terminator Kisium,
# 21115-21119: RustDesk (hbbs/hbbr), davon 21116 auch UDP.
ufw_public_ports:
  - 80
  - 443
  - 8443
  - 21115
  - 21116
  - 21117
  - 21118
  - 21119
ufw_public_udp_ports:
  - 21116
