---
- name: Fail2ban installieren
  ansible.builtin.apt:
    name: fail2ban
    state: present
    update_cache: true

- name: Jail-Konfiguration schreiben
  ansible.builtin.template:
    src: jail.local.j2
    dest: /etc/fail2ban/jail.local
    owner: root
    group: root
    mode: "0644"
  notify: Fail2ban neu starten

- name: Fail2ban starten und aktivieren
  ansible.builtin.systemd_service:
    name: fail2ban
    state: started
    enabled: true
