---
# Lunaria lief bis 16.11.2026 als handgestartetes Compose-Projekt "deploy" unter
# /opt/lunaria/deploy. Diese Rolle uebernimmt den Betrieb, ohne das laufende
# Verhalten zu aendern: gleiche Compose-Datei-Struktur, gleiches Datenvolumen,
# gleiches Netz, gleiches Image.
#
# Haertung: seit commit 688e1bd setzt das Template cap_drop: ALL und
# mem_limit: 512m (gemessen 51 MiB, Deckel mit Reserve). Das war ein eigener
# Schritt nach der Migration, nicht Teil davon - deshalb steht es hier
# ausdruecklich, damit der naechste Leser nicht denkt, es sei versehentlich
# hineingeraten.
#
# Was hier NICHT passiert:
#   - kein Image-Build im Repo: der Quellbaum liegt unter lunaria_src_dir und
#     ist nicht Teil dieses Repos.
- name: Vault-Werte fuer Lunaria vorhanden
  ansible.builtin.assert:
    that:
      - vault_lunaria_password is defined
      - vault_lunaria_session_secret is defined
      - vault_lunaria_beta_password is defined
      - vault_lunaria_beta_secret is defined
      - vault_deepseek_api_key is defined
      - vault_vapid_public_key is defined
      - vault_vapid_private_key is defined
    fail_msg: >-
      Es fehlen Lunaria-Secrets in group_vars/all/vault.yml. Schluesselnamen und
      Vorlage stehen in group_vars/all/vault.yml.example.
    quiet: true

- name: Projektverzeichnis anlegen
  ansible.builtin.file:
    path: "{{ lunaria_dir }}"
    state: directory
    mode: "0755"

- name: Datenvolumen sicherstellen
  community.docker.docker_volume:
    name: "{{ lunaria_data_volume }}"
    state: present

- name: Bestehenden Container und sein Compose-Projekt ermitteln
  community.docker.docker_container_info:
    name: lunaria-app
  register: lunaria_existing
  failed_when: false

- name: Alte Compose-Datei pruefen
  ansible.builtin.stat:
    path: "{{ lunaria_dir }}/docker-compose.vps.yml"
  register: lunaria_legacy_file

# Einmalige Migration: solange der Container noch zum alten Projekt "deploy"
# gehoert, belegt er den Namen lunaria-app. Ohne dieses down scheitert der
# Start unten mit einem Namenskonflikt.
- name: Altes Compose-Projekt "deploy" herunterfahren
  ansible.builtin.command:
    cmd: docker compose -f docker-compose.vps.yml down
    chdir: "{{ lunaria_dir }}"
  when:
    - lunaria_legacy_file.stat.exists
    - lunaria_existing.container is defined
    - lunaria_existing.container
    - (lunaria_existing.container.Config.Labels | default({}, true)).get('com.docker.compose.project', '') == 'deploy'
  changed_when: true

# Secret-Datei: 0600, root, kein Log - docker liest sie als Daemon.
# backup: die vorherige Fassung bleibt als .env.<datum> liegen; Schluessel, die
# die Rolle nicht kennt, verschwinden damit nicht spurlos.
- name: .env schreiben
  ansible.builtin.template:
    src: env.j2
    dest: "{{ lunaria_dir }}/.env"
    owner: root
    group: root
    mode: "0600"
    backup: true
  no_log: true
  notify: Lunaria neu starten

- name: Compose-Datei schreiben
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ lunaria_dir }}/compose.yaml"
    owner: root
    group: root
    mode: "0644"
  notify: Lunaria neu starten

# Im Check-Modus schreibt die Template-Task die Datei nicht. Auf einem Host,
# der die Rolle noch nie gesehen hat, fehlt sie dann und docker_compose_v2
# bricht ab - der vorgeschriebene Dry-Run waere unbrauchbar. Deshalb vorher
# pruefen und den Start im Check-Modus ueberspringen, statt blind zu starten.
- name: Vorhandensein der Compose-Datei pruefen
  ansible.builtin.stat:
    path: "{{ lunaria_dir }}/compose.yaml"
  register: lunaria_compose_file

- name: Stack starten
  community.docker.docker_compose_v2:
    project_src: "{{ lunaria_dir }}"
    files:
      - compose.yaml
    state: present
    pull: never
    build: "{{ 'always' if lunaria_rebuild | bool else 'policy' }}"
    remove_orphans: true
  when: lunaria_compose_file.stat.exists or not ansible_check_mode
