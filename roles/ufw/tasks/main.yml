---
- name: UFW installieren
  ansible.builtin.apt:
    name: ufw
    state: present
    update_cache: true

# Reihenfolge ist wichtig: erst Richtlinien und Regeln, dann aktivieren.
# Waere die 2222-Regel nicht vorher da, waere der Host beim Enable dicht.
- name: Eingehend standardmaessig verweigern
  community.general.ufw:
    policy: deny
    direction: incoming

- name: Ausgehend standardmaessig erlauben
  community.general.ufw:
    policy: allow
    direction: outgoing

- name: Oeffentliche Ports erlauben
  community.general.ufw:
    rule: allow
    port: "{{ item }}"
    proto: tcp
  loop: "{{ ufw_public_ports }}"

- name: SSH ausschliesslich auf dem Tailscale-Interface erlauben
  community.general.ufw:
    rule: allow
    port: "{{ ssh_port }}"
    proto: tcp
    direction: in
    interface: tailscale0

- name: UFW aktivieren
  community.general.ufw:
    state: enabled
