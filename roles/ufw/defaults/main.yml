---
# Die konkreten Portlisten stehen in group_vars/all/main.yml - das ist
# Host-Politik, nicht Rollenlogik. Hier nur die Fallbacks und Schalter.

# Optionales Wartungsnetz: erlaubt SSH zusaetzlich aus diesem CIDR.
# Fuer Umbauten und Testlaeufe, bei denen das Tailnet (noch) nicht steht.
ufw_maintenance_cidr: ""

ufw_public_ports:
  - 80
  - 443

ufw_public_udp_ports: []
