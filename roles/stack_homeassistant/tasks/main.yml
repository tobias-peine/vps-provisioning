---
- name: Projektverzeichnis anlegen
  ansible.builtin.file:
    path: "{{ hass_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Konfigurationsverzeichnis anlegen
  ansible.builtin.file:
    path: "{{ hass_dir }}/config"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Compose-Datei schreiben
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ hass_dir }}/compose.yaml"
    owner: root
    group: root
    mode: "0644"
  notify: Home Assistant neu starten

- name: Stack starten
  community.docker.docker_compose_v2:
    project_src: "{{ hass_dir }}"
    files:
      - compose.yaml
    state: present
    pull: missing
    remove_orphans: true
