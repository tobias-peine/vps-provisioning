---
- name: Projektverzeichnis anlegen
  ansible.builtin.file:
    path: "{{ hass_dir }}"
    state: directory
    mode: "0755"

- name: Konfigurationsverzeichnis anlegen
  ansible.builtin.file:
    path: "{{ hass_dir }}/config"
    state: directory
    mode: "0755"

- name: Compose-Datei schreiben
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ hass_dir }}/compose.yaml"
    owner: root
    group: root
    mode: "0644"
  notify: Home Assistant neu starten

- name: Stack starten
  community.docker.docker_compose_v2:
    project_src: "{{ hass_dir }}"
    files:
      - compose.yaml
    state: present
    pull: missing
    remove_orphans: true

# Alarme aus dem Monitoring landen ueber diesen Webhook bei der Familie.
# Die Datei liegt als Package in config/packages/, weil sie sonst bei einem
# HA-Neuaufbau aus dem Repo fehlen wuerde.
- name: Package-Verzeichnis anlegen
  ansible.builtin.file:
    path: "{{ hass_dir }}/config/packages"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Alertmanager-Webhook als Package ausliefern
  ansible.builtin.copy:
    src: packages/metrics_alerts.yaml
    dest: "{{ hass_dir }}/config/packages/metrics_alerts.yaml"
    owner: root
    group: root
    mode: "0644"
  notify: Home Assistant neu starten (Package)
