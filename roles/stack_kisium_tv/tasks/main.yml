---
- name: Projektverzeichnis pruefen
  ansible.builtin.stat:
    path: "{{ kisium_tv_dir }}"
  register: kisium_tv_root

- name: Abbrechen, wenn das Projektverzeichnis fehlt
  ansible.builtin.assert:
    that: kisium_tv_root.stat.isdir | default(false)
    fail_msg: "{{ kisium_tv_dir }} fehlt - die App-Quellen liegen nicht in diesem Repo."

- name: Quellverzeichnisse der Builds pruefen
  ansible.builtin.stat:
    path: "{{ kisium_tv_dir }}/{{ item }}"
  loop:
    - stream-proxy
    - catalog-sync
  register: kisium_tv_sources

- name: Abbrechen, wenn Build-Kontext fehlt
  ansible.builtin.assert:
    that: >-
      kisium_tv_sources.results
      | selectattr('stat.isdir', 'defined')
      | selectattr('stat.isdir')
      | list | length == 2
    fail_msg: "stream-proxy/ und catalog-sync/ muessen unter {{ kisium_tv_dir }} liegen."

# force: false - die .env dieser App hat rund 35 Schluessel (Feed-URL,
# User-Agents, Timeouts), die zum Projekt gehoeren und nicht in dieses Repo.
# Ein Template wuerde sie beim ersten Lauf loeschen. Die Datei wird nur
# angelegt, wenn sie fehlt (frischer Host).
- name: .env anlegen, falls nicht vorhanden
  ansible.builtin.template:
    src: env.j2
    dest: "{{ kisium_tv_dir }}/.env"
    owner: root
    group: root
    mode: "0600"
    force: false
  no_log: true
  vars:
    stack_env: "{{ kisium_tv_env | combine(kisium_tv_secrets) }}"
  notify: Kisium-TV neu starten

- name: Compose-Datei schreiben
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ kisium_tv_dir }}/docker-compose.yml"
    owner: root
    group: root
    mode: "0644"
  notify: Kisium-TV neu starten

- name: Stack bauen und starten
  community.docker.docker_compose_v2:
    project_src: "{{ kisium_tv_dir }}"
    state: present
    build: policy
    pull: missing
    remove_orphans: true
