---
- name: Mail-Zugangsdaten vorhanden
  ansible.builtin.assert:
    that:
      - vault_mail_user is defined
      - vault_mail_password is defined
    fail_msg: >-
      Es fehlen vault_mail_user / vault_mail_password in
      group_vars/all/vault.yml. Der Brevo-SMTP-Login steht bewusst nicht mehr
      im Repo - Schluesselnamen siehe group_vars/all/vault.yml.example.
    quiet: true

- name: Projektverzeichnis anlegen
  ansible.builtin.file:
    path: "{{ kisium_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: .env schreiben
  ansible.builtin.template:
    src: env.j2
    dest: "{{ kisium_dir }}/.env"
    owner: root
    group: root
    mode: "0600"
  no_log: true
  vars:
    stack_env: "{{ kisium_env | combine(kisium_secrets) }}"
  notify: Kisium neu starten

- name: Compose-Datei schreiben
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ kisium_dir }}/docker-compose.yml"
    owner: root
    group: root
    mode: "0644"
  notify: Kisium neu starten

# Der frueher handgepflegte Override (SMTP-Zugang) ist in die Vorlage
# uebernommen. Bliebe er liegen, wuerde Compose beide Dateien mischen und
# die Mail-Zugangsdaten aus einer nicht mehr gesetzten Variable lesen.
- name: Alten Override entfernen
  ansible.builtin.file:
    path: "{{ kisium_dir }}/docker-compose.override.yml"
    state: absent
  notify: Kisium neu starten

# Hinweis: docker_compose_v2 meldet auch bei unveraendertem Zustand
# "changed" (Waiting-Aktionen fuer depends_on). Gegengeprueft mit
# `docker compose --dry-run`: dort steht jeder Container auf "Running".
- name: Stack starten
  community.docker.docker_compose_v2:
    project_src: "{{ kisium_dir }}"
    state: present
    pull: missing
    remove_orphans: true
