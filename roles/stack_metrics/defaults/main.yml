---
# Verzeichnis des Stacks auf dem Monitoring-Host.
metrics_dir: /opt/metrics

# Gepinnte Versionen statt ":latest": ein Versionssprung soll ein bewusster
# Commit sein und nicht das Ergebnis eines naechtlichen Pulls.
metrics_prometheus_image: "prom/prometheus:v3.16.0"
metrics_alertmanager_image: "prom/alertmanager:v0.34.2"
metrics_grafana_image: "grafana/grafana:13.3.1"
# Der Brueckendienst braucht nur die Standardbibliothek von Python.
metrics_alertbridge_image: "python:3.12-alpine"

# Aufbewahrung der Zeitreihen: 30 Tage beantworten "was war letzte Woche los?"
metrics_retention: "30d"

# Speicherdeckel. Grafana 13 lag mit 256m am Deckel und kam nicht bis zum
# HTTP-Server - 512m sind das Minimum in der Praxis.
metrics_prometheus_mem: 512m
metrics_alertmanager_mem: 128m
metrics_alertbridge_mem: 64m
metrics_grafana_mem: 512m
metrics_grafana_port: 3001
metrics_alertmanager_port: 9093

# Adresse, an der die Web-Oberflaechen (Prometheus, Alertmanager, Grafana)
# lauschen: nur Tailscale, nie oeffentlich - Docker umgeht ufw.
metrics_tailscale_ip: "{{ ansible_host }}"

# Adressen der beiden Hosts, die abgefragt werden (Tailscale).
# Werden in site.yml aus dem Inventory gesetzt:
#   metrics_monitor_host: der Host, auf dem diese Rolle laeuft
#   metrics_app_host:     der Host mit den Anwendungen
metrics_monitor_host: "{{ ansible_host }}"
metrics_app_host: "{{ ansible_host }}"

# Adresse, unter der Home Assistant erreichbar ist (App-Host).
metrics_ha_host: "{{ metrics_app_host }}"

# Webhook-Kennung in Home Assistant. Bewusst kein Geheimnis: HA ist nur ueber
# Tailscale erreichbar, und der Alarmweg soll ohne zusaetzliche Secret-Verwaltung
# funktionieren. Wer die Kennung kennt, kann Alarme ausloesen, aber nicht lesen.
metrics_ha_webhook_id: "metrics-alerts"
