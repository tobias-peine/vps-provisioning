---
# Verzeichnis des Stacks auf dem Host.
metrics_dir: /opt/metrics

# Gepinnte Versionen statt ":latest": ein Versionssprung soll ein bewusster
# Commit sein und nicht das Ergebnis eines naechtlichen Pulls.
metrics_prometheus_image: "prom/prometheus:v3.16.0"
metrics_node_exporter_image: "prom/node-exporter:v1.12.1"
# cAdvisor 0.61.0 erschien am 16.11.2026. Bewusst die Vorgaengerversion, damit
# nicht der erste Tag eines Releases auf dem Produktionshost landet. Ab v0.53
# liegt das Image auf ghcr.io - unter gcr.io/cadvisor/cadvisor gibt es die
# neueren Tags nicht mehr.
metrics_cadvisor_image: "ghcr.io/google/cadvisor:v0.60.6"

# Aufbewahrung der Zeitreihen: 30 Tage beantworten "was war letzte Woche los?"
# und kosten bei diesen wenigen Targets nur wenige hundert MB Plattenplatz.
metrics_retention: "30d"

# Speicherdeckel pro Container. Der Host hat 7,8 GB RAM und bereits 19 Container
# - ohne Deckel holt sich Prometheus bei einem Kardinalitaets-Ausreisser den
# Swap, und der ist hier schon zu zwei Dritteln belegt.
metrics_prometheus_mem: 512m
metrics_node_exporter_mem: 128m
# cAdvisor liest /var/lib/docker und liegt im ersten Lauf bei ~250 MB inklusive
# Page-Cache. Bei 256m Deckel wuerde er sich selbst OOM-killen.
metrics_cadvisor_mem: 512m

# Grafana (Phase 2). 13.3.1 ist ein Patch-Release vom 10.11.2026, kein
# frischer Major - bewusst nicht 13.3.0 direkt am Erscheinungstag.
metrics_grafana_image: "grafana/grafana:13.3.1"
metrics_grafana_mem: 512m
# 3001 statt 3000: auf 127.0.0.1:3000 laeuft bereits die Homepage.
metrics_grafana_port: 3001

