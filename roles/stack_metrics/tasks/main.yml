---
- name: Projektverzeichnis anlegen
  ansible.builtin.file:
    path: "{{ metrics_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Unterverzeichnisse anlegen
  ansible.builtin.file:
    path: "{{ metrics_dir }}/{{ item }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  loop:
    - rules
    - alertmanager
    - alertbridge
    - grafana/provisioning/datasources
    - grafana/provisioning/dashboards
    - grafana/dashboards

# Das Adminpasswort wird einmalig zufaellig erzeugt und liegt danach root-only
# auf dem Host. force: false verhindert, dass ein erneuter Lauf das Passwort
# stillschweigend austauscht - das waere nach dem ersten Login ein Raetsel.
- name: Grafana-Adminpasswort erzeugen (nur beim ersten Lauf)
  ansible.builtin.copy:
    content: "GF_SECURITY_ADMIN_PASSWORD={{ lookup('password', '/dev/null length=24 chars=ascii_letters,digits') }}\n"
    dest: "{{ metrics_dir }}/grafana.env"
    owner: root
    group: root
    mode: "0600"
    force: false
  no_log: true

# Das ntfy-Topic ist die halbe Zugangskontrolle: wer es kennt, kann mitlesen.
# Es wird einmalig erzeugt und steht danach in dieser Datei.
- name: Alarm-Thema fuer ntfy erzeugen (nur beim ersten Lauf)
  ansible.builtin.copy:
    content: "NTFY_TOPIC=kisium-alerts-{{ lookup('password', '/dev/null length=16 chars=ascii_lowercase,digits') }}\n"
    dest: "{{ metrics_dir }}/alertbridge.env"
    owner: root
    group: root
    mode: "0600"
    force: false
  no_log: true

- name: Brueckendienst installieren
  ansible.builtin.copy:
    src: alertbridge.py
    dest: "{{ metrics_dir }}/alertbridge/alertbridge.py"
    owner: root
    group: root
    mode: "0644"

- name: Prometheus als Grafana-Datasource provisionieren
  ansible.builtin.copy:
    src: provisioning/datasources/prometheus.yml
    dest: "{{ metrics_dir }}/grafana/provisioning/datasources/prometheus.yml"
    owner: root
    group: root
    mode: "0644"
  notify: Grafana neu starten

- name: Dashboard-Provider provisionieren
  ansible.builtin.copy:
    src: provisioning/dashboards/default.yml
    dest: "{{ metrics_dir }}/grafana/provisioning/dashboards/default.yml"
    owner: root
    group: root
    mode: "0644"
  notify: Grafana neu starten

# Dashboards werden nicht neu gestartet: Grafana liest den Ordner alle 30 s neu.
- name: Dashboards ausliefern
  ansible.builtin.copy:
    src: "dashboards/{{ item }}"
    dest: "{{ metrics_dir }}/grafana/dashboards/{{ item }}"
    owner: root
    group: root
    mode: "0644"
  loop:
    - host-uebersicht.json
    - container-uebersicht.json
    - backup-und-alarme.json

- name: Alarmregeln schreiben
  ansible.builtin.copy:
    src: "rules/{{ item }}"
    dest: "{{ metrics_dir }}/rules/{{ item }}"
    owner: root
    group: root
    mode: "0644"
  loop:
    - host.yml
    - container.yml
  notify: Prometheus-Konfiguration neu laden

- name: Alertmanager-Konfiguration schreiben
  ansible.builtin.template:
    src: alertmanager.yml.j2
    dest: "{{ metrics_dir }}/alertmanager/alertmanager.yml"
    owner: root
    group: root
    mode: "0644"
  notify: Alertmanager neu starten

- name: Prometheus-Konfiguration schreiben
  ansible.builtin.template:
    src: prometheus.yml.j2
    dest: "{{ metrics_dir }}/prometheus.yml"
    owner: root
    group: root
    mode: "0644"
  notify: Prometheus-Konfiguration neu laden

- name: Compose-Datei schreiben
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ metrics_dir }}/compose.yaml"
    owner: root
    group: root
    mode: "0644"
  notify: Metrics-Stack neu starten

- name: Stack starten
  community.docker.docker_compose_v2:
    project_src: "{{ metrics_dir }}"
    files:
      - compose.yaml
    state: present
    pull: missing
    remove_orphans: true

# Die auf diesem Host erzeugten Zugangsdaten liegen sonst nur hier. Der
# App-Host nimmt sie in seinen Restic-Job auf; Voraussetzung ist der Key
# /root/.ssh/id_ed25519_backup in authorized_keys von admin@<App-Host>
# (einmalig von Hand, siehe README).
- name: Skript fuer die Secret-Sicherung installieren
  ansible.builtin.template:
    src: push-secrets.sh.j2
    dest: /usr/local/sbin/push-secrets.sh
    owner: root
    group: root
    mode: "0700"

- name: Cron-Eintrag fuer die Secret-Sicherung installieren
  ansible.builtin.copy:
    src: cron.d/monitor-secrets
    dest: /etc/cron.d/monitor-secrets
    owner: root
    group: root
    mode: "0644"

# Woechentlicher Selbsttest: faellt ein Alarmkanal aus, merkt man das sonst
# erst, wenn es darauf ankommt.
- name: Selbsttest-Skript installieren
  ansible.builtin.copy:
    src: alert-selftest.sh
    dest: /usr/local/sbin/alert-selftest.sh
    owner: root
    group: root
    mode: "0700"

- name: Cron-Eintrag fuer den Selbsttest installieren
  ansible.builtin.copy:
    src: cron.d/alert-selftest
    dest: /etc/cron.d/alert-selftest
    owner: root
    group: root
    mode: "0644"
