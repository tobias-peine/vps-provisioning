---
homeserver_dir: /opt/stack

# Wurzel der Host-Verzeichnisse, die als Bind-Mounts in die Container gehen.
homeserver_data_root: /opt

# Images mit Digest gepinnt, wo ein Registry-Digest existiert. Ein beweglicher
# Tag wie "latest" wuerde beim naechsten Pull unbemerkt eine andere Version ziehen.
# Stand: 13.11.2026 (Patchday). Vorherige Digests stehen auf dem Host in
# /root/patchday-2026-11-13-digests.txt - damit ist der Rollback ein Zweizeiler.
homeserver_image_ollama: >-
  ollama/ollama@sha256:910d0d8107b538fb0894e63163eb195de0cc7aefcbc666dc62d3b18f71124592
homeserver_image_paperless: >-
  ghcr.io/paperless-ngx/paperless-ngx@sha256:d704e84f88300eb6ab001ab15720a2330ff99169cf9f94d6b8fcc44b63a84c84
homeserver_image_npm: "jc21/nginx-proxy-manager@sha256:91277490a919c792aa73b8d291af1ca84d32be74df988e543137976515763534"
homeserver_image_n8n: "docker.n8n.io/n8nio/n8n@sha256:3566fc1c340d8888a2e02c0dfbf7558fe4e3b300a9da892b1223e223404c5828"
homeserver_image_searxng: "searxng/searxng@sha256:82b222dd1854c43241874874fbc985006556230804dc819ef2a639eeb574d0e2"
homeserver_image_postgres: "postgres:16"
homeserver_image_redis: "redis:7"
# Lokal gebaut (nonroot-Variante) - TODO: nach ghcr.io pushen und per Digest pinnen.
homeserver_image_openwebui: "open-webui:nonroot-20261103"

# Host-Ports. Alle bis auf NPM und den TLS-Terminator haengen an 127.0.0.1.
homeserver_webui_port: 8080
homeserver_searxng_port: 8888
homeserver_n8n_port: 5678
homeserver_npm_admin_port: 81

# Nicht-geheime Werte der .env. Secrets stehen in homeserver_secrets und kommen
# aus dem Vault.
homeserver_env:
  PAPERLESS_URL: "https://paperless.{{ base_domain }}"
  PAPERLESS_TIME_ZONE: "{{ timezone }}"
  PAPERLESS_OCR_LANGUAGE: deu+eng
  PAPERLESS_ADMIN_USER: paperless
  PAPERLESS_ADMIN_MAIL: "admin@{{ base_domain }}"
  WEBUI_URL: "https://chat.{{ base_domain }}"
  N8N_HOST: "n8n.{{ base_domain }}"
  N8N_PROTOCOL: https
  SEARXNG_BASE_URL: "https://search.{{ base_domain }}"

# Diese Werte werden aus group_vars/all/vault.yml aufgeloest. Fehlt der Vault,
# bricht der Lauf beim Schreiben der .env ab - lieber laut als mit leerem Passwort.
homeserver_secrets:
  N8N_ENCRYPTION_KEY: "{{ vault_n8n_encryption_key }}"
  PAPERLESS_DB_PASSWORD: "{{ vault_paperless_db_password }}"
  PAPERLESS_SECRET_KEY: "{{ vault_paperless_secret_key }}"
  PAPERLESS_ADMIN_PASSWORD: "{{ vault_paperless_admin_password }}"
  WEBUI_SECRET_KEY: "{{ vault_webui_secret_key }}"
