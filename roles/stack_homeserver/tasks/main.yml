---
- name: Projektverzeichnis anlegen
  ansible.builtin.file:
    path: "{{ homeserver_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

# Kein owner/group erzwingen: die Container legen ihre Verzeichnisse mit ihrer
# eigenen UID an (z. B. searxng mit 977). Ein erzwungener Wechsel wuerde bei
# jedem Lauf hin- und herspringen.
- name: Verzeichnisse fuer Bind-Mounts anlegen
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0755"
  loop:
    - "{{ homeserver_data_root }}/npm/data"
    - "{{ homeserver_data_root }}/npm/letsencrypt"
    - "{{ homeserver_data_root }}/searxng/searxng"
    - "{{ homeserver_data_root }}/paperless/consume"
    - "{{ homeserver_data_root }}/paperless/export"

# Ollama und Open WebUI laufen als uid 1000. Ein frisch erzeugtes Docker-Volume
# gehoert root - der Container kann dann weder Modelle noch Datenbank anlegen
# und faellt durch den Healthcheck. Auf dem Bestandshost faellt das nie auf,
# weil die Volumes dort schon gehoeren.
# Ollama und Open WebUI laufen als uid 1000. Ein frisch erzeugtes Docker-Volume
# gehoert root - der Container kann dann weder Modelle noch Datenbank anlegen
# und faellt durch den Healthcheck. Auf dem Bestandshost faellt das nie auf,
# weil die Volumes dort schon gehoeren.
#
# Bewusst ueber die CLI statt ueber community.docker: die Module scheitern auf
# Systemen mit urllib3>=2 an "Not supported URL scheme http+docker", die
# Compose-Rolle laeuft dort aber einwandfrei.
- name: Volumes fuer nicht-root-Container anlegen
  ansible.builtin.command:
    cmd: docker volume create {{ item }}
    creates: /var/lib/docker/volumes/{{ item }}/_data
  loop:
    - homeserver_ollama
    - homeserver_webui

- name: Rechte in den Volumes setzen
  ansible.builtin.command:
    cmd: docker run --rm -v {{ item }}:/m alpine:3.20 chown -R 1000:1000 /m
  loop:
    - homeserver_ollama
    - homeserver_webui
  changed_when: true

# no_log: die .env enthaelt Passwoerter und Keys; ohne das landen sie im Log.
- name: .env schreiben
  ansible.builtin.template:
    src: env.j2
    dest: "{{ homeserver_dir }}/.env"
    owner: root
    group: root
    mode: "0600"
  no_log: true
  vars:
    stack_env: "{{ homeserver_env | combine(homeserver_secrets) }}"
  notify: Homeserver neu starten

- name: Compose-Datei schreiben
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ homeserver_dir }}/docker-compose.yml"
    owner: root
    group: root
    mode: "0644"
  notify: Homeserver neu starten

# Der frueher handgepflegte Override ist vollstaendig in die Vorlage uebernommen.
# Er muss weg, sonst wuerde Compose beide Dateien mischen.
- name: Alten Override entfernen
  ansible.builtin.file:
    path: "{{ homeserver_dir }}/docker-compose.override.yml"
    state: absent

# Hinweis: docker_compose_v2 meldet auch bei unveraendertem Zustand
# "changed" (Waiting-Aktionen fuer depends_on). Gegengeprueft mit
# `docker compose --dry-run`: dort steht jeder Container auf "Running".
- name: Stack starten
  community.docker.docker_compose_v2:
    project_src: "{{ homeserver_dir }}"
    state: present
    pull: missing
    remove_orphans: true

# NPM haengt in zwei Netzen (homeserver_default und kisium-net) und ist damit die
# einzige Bruecke zwischen den Compose-Projekten. Am 13.11.2026 kam der Container
# nach einem Reboot nur mit kisium-net hoch - alle homeserver-Domains antworteten
# mit 502, bis der Anschluss von Hand nachgezogen wurde. Der Guard macht das
# idempotent beim Boot; er laeuft erst, wenn der Stack steht.
- name: Netz-Guard-Skript fuer NPM installieren
  ansible.builtin.copy:
    src: npm-network-guard.sh
    dest: /usr/local/sbin/npm-network-guard.sh
    owner: root
    group: root
    mode: "0755"

- name: Netz-Guard-Unit fuer NPM installieren
  ansible.builtin.copy:
    src: npm-network-guard.service
    dest: /etc/systemd/system/npm-network-guard.service
    owner: root
    group: root
    mode: "0644"
  notify: Systemd neu laden

- name: Netz-Guard aktivieren und starten
  ansible.builtin.systemd_service:
    name: npm-network-guard.service
    enabled: true
    state: started
