---
# Reihenfolge ist nicht kosmetisch:
#   - tailscale vor ssh/ufw: sonst gibt es nach dem Umschalten keinen zweiten
#     Weg mehr auf den Host.
#   - stack_kisium vor stack_homeserver: der homeserver haengt sich an das
#     externe Netz kisium-net, das der kisium-Stack erzeugt.
#   - docker nach dem Hardening: die Stacks starten erst, wenn die Firewall
#     steht - sonst oeffnen ihre Ports kurz ins Leere.
#   - stack_homeserver vor homepage/homeassistant: beide nutzen homeserver_default.
#
# ssh und ufw duerfen nicht im selben Lauf wie der erste become-Wechsel auf einen
# unbekannten Host laufen: wer sich dabei aussperrt, kommt nur ueber die Konsole
# zurueck. Ablauf und Rettung stehen in README Abschnitt 7.
- name: Webtropia-VPS provisionieren
  # all statt prod, damit -i vm.ini/-i test.ini nicht still ohne Hosts durchlaeuft.
  hosts: all
  become: true
  roles:
    - role: base
      tags: [base, packages, updates]
    - role: tailscale
      tags: [tailscale, vpn]
    - role: ssh
      tags: [ssh, hardening]
    - role: ufw
      tags: [ufw, firewall, hardening]
    - role: fail2ban
      tags: [fail2ban, hardening]
    - role: docker
      tags: [docker]
    - role: stack_kisium
      tags: [kisium, stacks]
    - role: stack_homeserver
      tags: [homeserver, stacks]
    - role: stack_homepage
      tags: [homepage, stacks]
    - role: stack_homeassistant
      tags: [homeassistant, stacks]
    - role: stack_kisium_tv
      tags: [kisium_tv, stacks]
    - role: stack_rustdesk
      tags: [rustdesk, stacks]
    - role: monitoring
      tags: [monitoring]
