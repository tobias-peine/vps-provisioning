# ansible.cfg - gilt fuer jeden Aufruf im Repo-Root (kein ANSIBLE_CONFIG noetig).
# Jede Zeile ist eine Entscheidung, keine Voreinstellung.

[defaults]
# Inventory: die echte Datei ist gitignored, die Vorlage ist versioniert.
inventory = ./hosts.ini

# YAML-Ausgabe: Diffs und Recaps sind zeilenweise lesbar - wichtig, wenn ein
# PR Aenderungen an fuenf Stacks auf einmal zeigt.
# Das yaml-Callback kommt aus community.general (siehe requirements.yml),
# nicht aus ansible-core. Fehlt die Collection, bricht der Lauf mit
# "Invalid callback for stdout specified: yaml" ab - kein stiller Fallback.
stdout_callback = yaml

# Ein Host, fuenf Compose-Projekte: 10 Forks halten apt/Docker-Tasks parallel,
# ohne den VPS in den Swap zu treiben.
forks = 10

# host_key_checking = False ist hier vertretbar, weil der Host nicht ueber
# eine oeffentliche IP/Port 22 erreicht wird, sondern ausschliesslich ueber
# Tailscale: WireGuard authentifiziert beide Seiten kryptografisch, die
# 100.64.x.x-Adresse ist nicht spoofbar und der SSH-Port ist im Internet
# nicht erreichbar. Ein TOFU-known_hosts haette hier kaum Schutzwert.
# NICHT vertretbar waere das fuer einen Host, der per oeffentlicher IP
# oder per DNS-Name mit Port 22 angesprochen wird.
# TODO: known_hosts committen und diese Zeile entfernen, sobald der
# Host-Key-Rotationsprozess steht.
host_key_checking = False

# Deprecation-Warnungen sichtbar lassen: der einzige Fruehwarner, bevor ein
# Modul in der naechsten ansible-core-Version verschwindet.
deprecation_warnings = True

# Kein Retry-File: Ein-Host-Deploy, kein Massenlauf, der wiederaufgesetzt wird.
retry_files_enabled = False

# Keine ASCII-Kuh: CI-Logs und Screenreader-Ausgabe bleiben so ruhig.
nocows = 1

# Skips nicht pro Host auflisten: bei 15 Containern sind das hunderte Zeilen
# Rauschen pro Lauf.
display_skipped_hosts = False

# Rollen/Collections aus dem Repo, nicht aus ~/.ansible - reproduzierbar.
collections_path = ./collections
roles_path = ./roles

[privilege_escalation]
# admin ist kein root. sudo nur fuer Tasks, die es brauchen.
become = True
become_method = sudo
become_user = root
# Passwort wird bei Bedarf per -K abgefragt, nicht in dieser Datei hinterlegt.
become_ask_pass = False

[ssh_connection]
# Pipelining: weniger SSH-Runden pro Task, bei 15 Containern spuerbar schneller.
# Setzt voraus, dass sudo ohne requiretty laeuft - Ubuntu-Standard.
pipelining = True

[inventory]
# Ein Tippfehler in hosts.ini soll den Lauf abbrechen, nicht halb leise
# einen Host ueberspringen.
unparsed_is_failed = True
